<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MIYORA MD — Session Settings Web</title>
  <style>
    :root {
      --bg: #070912;
      --card: #0e1324;
      --card-2: #141b33;
      --border: rgba(120, 145, 255, 0.2);
      --text: #eef2ff;
      --muted: #94a3b8;
      --accent: #a855f7;
      --accent-2: #ec4899;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(circle at top, #181336 0%, var(--bg) 60%);
      color: var(--text);
      min-height: 100vh;
      padding: 24px 16px;
    }
    .wrap { max-width: 540px; margin: 0 auto; }
    .header { text-align: center; margin-bottom: 22px; }
    .header h1 {
      margin: 0;
      font-size: 1.6rem;
      background: linear-gradient(90deg, #e879f9, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header p { margin: 6px 0 0; color: var(--muted); font-size: 0.9rem; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
    }
    .hidden { display: none !important; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    label {
      display: block;
      font-size: 0.84rem;
      color: var(--muted);
      margin-bottom: 6px;
      font-weight: 600;
    }
    input, select {
      width: 100%;
      padding: 11px 13px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card-2);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
    }
    input:focus, select:focus { border-color: var(--accent); }
    .pass-input {
      letter-spacing: 3px;
      font-family: monospace;
      font-size: 1.05rem;
    }
    .field { flex: 1 1 200px; margin-bottom: 14px; }
    .toggle-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 12px;
    }
    .toggle-title { font-weight: 600; font-size: 0.95rem; }
    .toggle-sub { font-size: 0.8rem; color: var(--muted); }
    .switch { position: relative; width: 48px; height: 26px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0; background: #334155;
      border-radius: 999px; cursor: pointer; transition: 0.2s;
    }
    .slider::before {
      content: ""; position: absolute; width: 20px; height: 20px;
      left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: 0.2s;
    }
    .switch input:checked + .slider {
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
    }
    .switch input:checked + .slider::before { transform: translateX(22px); }
    .preview-wrap { margin: 8px 0 14px; text-align: center; }
    .preview-wrap img {
      max-height: 150px; max-width: 100%; border-radius: 12px;
      border: 1px solid var(--border); object-fit: cover;
    }
    button {
      padding: 11px 16px; border-radius: 10px; border: none;
      font-weight: 600; font-size: 0.92rem; cursor: pointer; color: #fff;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
    }
    button.secondary { background: var(--card-2); border: 1px solid var(--border); }
    .full-btn { width: 100%; padding: 12px; font-size: 0.98rem; }
    .status {
      margin-top: 12px; padding: 10px 12px; border-radius: 10px;
      font-size: 0.88rem; display: none;
    }
    .status.ok {
      display: block; background: rgba(34, 197, 94, 0.14);
      border: 1px solid rgba(34, 197, 94, 0.4); color: #86efac;
    }
    .status.err {
      display: block; background: rgba(239, 68, 68, 0.14);
      border: 1px solid rgba(239, 68, 68, 0.4); color: #fca5a5;
    }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 14px; gap: 10px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <h1>⚙️ MIYORA MD — Settings Web</h1>
      <p>Login with your session number & password</p>
    </div>

    <div id="loginCard" class="card">
      <div class="field">
        <label for="loginSessionSelect">Select Session Number</label>
        <select id="loginSessionSelect"></select>
      </div>

      <div class="field">
        <label for="loginOwner">Session Number</label>
        <input id="loginOwner" type="text" placeholder="e.g. 94767475809" />
      </div>

      <div class="field">
        <label for="loginPassword">Session Password</label>
        <input id="loginPassword" class="pass-input" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter') loginPanel()" />
      </div>

      <button type="button" class="full-btn" onclick="loginPanel()">🔓 Login</button>
      <div id="loginStatus" class="status"></div>
    </div>

    <div id="panelCard" class="card hidden">
      <div class="topbar">
        <div>
          <div style="font-size:0.8rem; color:var(--muted);">Active Session</div>
          <div id="activeOwnerLabel" style="font-weight:700; color:#f0abfc;"></div>
        </div>
        <button type="button" class="secondary" onclick="logoutPanel()">Logout</button>
      </div>

      <div class="row">
        <div class="field">
          <label for="botName">Bot Name</label>
          <input id="botName" type="text" />
        </div>
        <div class="field" style="max-width:130px;">
          <label for="prefix">Prefix</label>
          <input id="prefix" type="text" maxlength="4" />
        </div>
      </div>

      <div class="field">
        <label for="mode">Bot Mode</label>
        <select id="mode">
          <option value="public">Public</option>
          <option value="private">Private</option>
        </select>
      </div>

      <div class="field">
        <label for="logo">Menu Logo Image URL</label>
        <input id="logo" type="url" placeholder="https://files.catbox.moe/u6ek3x.png" oninput="updatePreview()" />
      </div>

      <div class="preview-wrap">
        <img id="logoPreview" src="https://files.catbox.moe/u6ek3x.png" alt="Logo Preview" onerror="this.style.display='none'" onload="this.style.display='inline-block'" />
      </div>

      <div class="toggle-box">
        <div>
          <div class="toggle-title">🗑️ Anti-Delete</div>
          <div class="toggle-sub">Recover deleted messages and media</div>
        </div>
        <label class="switch">
          <input id="antidelete" type="checkbox" />
          <span class="slider"></span>
        </label>
      </div>

      <div class="toggle-box">
        <div>
          <div class="toggle-title">✏️ Anti-Edit</div>
          <div class="toggle-sub">Detect edited messages</div>
        </div>
        <label class="switch">
          <input id="antiedit" type="checkbox" />
          <span class="slider"></span>
        </label>
      </div>

      <button type="button" class="full-btn" onclick="savePanelSettings()">💾 Save Settings</button>
      <div id="panelStatus" class="status"></div>
    </div>
  </div>

  <script>
    let authOwner = '';
    let authPassword = '';

    function setBoxStatus(id, msg, isOk) {
      const el = document.getElementById(id);
      el.textContent = msg;
      el.className = 'status ' + (isOk ? 'ok' : 'err');
    }

    function updatePreview() {
      const url = document.getElementById('logo').value.trim();
      document.getElementById('logoPreview').src = url || 'https://files.catbox.moe/u6ek3x.png';
    }

    async function loadSessionList() {
      try {
        const res = await fetch('/api/sessions');
        const data = await res.json();
        const sel = document.getElementById('loginSessionSelect');
        sel.innerHTML = '';
        if (data.ok && Array.isArray(data.sessions) && data.sessions.length) {
          data.sessions.forEach((num) => {
            const opt = document.createElement('option');
            opt.value = num;
            opt.textContent = num;
            sel.appendChild(opt);
          });
          document.getElementById('loginOwner').value = sel.value;
        } else {
          const opt = document.createElement('option');
          opt.value = '';
          opt.textContent = 'Enter session number below';
          sel.appendChild(opt);
        }
      } catch (e) {
        setBoxStatus('loginStatus', 'Failed to load sessions: ' + e.message, false);
      }
    }

    document.getElementById('loginSessionSelect').addEventListener('change', (e) => {
      if (e.target.value) document.getElementById('loginOwner').value = e.target.value;
    });

    async function loginPanel() {
      const ownerNumber = document.getElementById('loginOwner').value.trim();
      const password = document.getElementById('loginPassword').value.trim();
      if (!ownerNumber || !password) {
        return setBoxStatus('loginStatus', 'Session number and password are required.', false);
      }

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ownerNumber, password })
        });
        const data = await res.json();
        if (!data.ok) {
          return setBoxStatus('loginStatus', data.error || 'Login failed', false);
        }

        authOwner = data.ownerNumber;
        authPassword = password;
        const s = data.settings || {};

        document.getElementById('activeOwnerLabel').textContent = authOwner;
        document.getElementById('botName').value = s.name || '';
        document.getElementById('prefix').value = s.prefix || '.';
        document.getElementById('mode').value = s.mode || 'public';
        document.getElementById('logo').value = s.logo || '';
        document.getElementById('antidelete').checked = Boolean(s.antidelete);
        document.getElementById('antiedit').checked = Boolean(s.antiedit);
        updatePreview();

        document.getElementById('loginCard').classList.add('hidden');
        document.getElementById('panelCard').classList.remove('hidden');
        setBoxStatus('panelStatus', 'Logged in!', true);
      } catch (e) {
        setBoxStatus('loginStatus', 'Login error: ' + e.message, false);
      }
    }

    function logoutPanel() {
      authOwner = '';
      authPassword = '';
      document.getElementById('loginPassword').value = '';
      document.getElementById('panelCard').classList.add('hidden');
      document.getElementById('loginCard').classList.remove('hidden');
    }

    async function savePanelSettings() {
      if (!authOwner || !authPassword) return logoutPanel();

      const payload = {
        name: document.getElementById('botName').value.trim(),
        prefix: document.getElementById('prefix').value.trim() || '.',
        mode: document.getElementById('mode').value,
        logo: document.getElementById('logo').value.trim(),
        antidelete: document.getElementById('antidelete').checked,
        antiedit: document.getElementById('antiedit').checked
      };

      try {
        const res = await fetch('/api/settings/' + encodeURIComponent(authOwner), {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-panel-password': authPassword
          },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (!data.ok) {
          if (res.status === 401) logoutPanel();
          return setBoxStatus('panelStatus', data.error || 'Failed to save', false);
        }
        setBoxStatus('panelStatus', '✅ Saved to MongoDB!', true);
      } catch (e) {
        setBoxStatus('panelStatus', 'Save error: ' + e.message, false);
      }
    }

    loadSessionList();
  </script>
</body>
</html>
